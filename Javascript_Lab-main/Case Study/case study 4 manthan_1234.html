<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure ATM PIN Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f7f9fc);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .atm-card {
            width: 450px;
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(30, 64, 175, 0.18);
        }

        .header {
            padding: 30px;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #173b8f, #2563eb);
        }

        .security-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            font-size: 28px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 8px 0 0;
            color: #dbeafe;
            font-size: 14px;
        }

        .content {
            padding: 32px;
        }

        .info-box {
            padding: 12px 15px;
            margin-bottom: 22px;
            border-left: 4px solid #2563eb;
            border-radius: 7px;
            background-color: #eff6ff;
            color: #475569;
            font-size: 13px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #334155;
            font-size: 15px;
            font-weight: bold;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 18px;
            text-align: center;
            letter-spacing: 7px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .error {
            min-height: 20px;
            margin-top: 9px;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        .result-box {
            display: none;
            margin-top: 22px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .result-title {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }

        .result-details {
            margin: 9px 0 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            padding: 16px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="atm-card">

        <div class="header">

            <div class="security-icon">🔒</div>

            <h1>Secure ATM Verification</h1>

            <p>Palindrome-Based PIN Security System</p>

        </div>

        <div class="content">

            <div class="info-box">

                Enter a numeric PIN to verify whether it reads
                the same from left to right and right to left.

            </div>

            <label for="pin">Enter ATM PIN</label>

            <div class="input-box">

                <input
                    type="password"
                    id="pin"
                    inputmode="numeric"
                    maxlength="12"
                    placeholder="••••"
                    autocomplete="off"
                >

            </div>

            <div class="error" id="error"></div>

            <button type="button" onclick="verifyPIN()">

                Verify Secure PIN

            </button>

            <div class="result-box" id="resultBox">

                <p class="result-title" id="resultTitle">
                    Verification Result
                </p>

                <p class="result-details" id="resultDetails">
                </p>

            </div>

        </div>

        <div class="footer">

            Secure ATM PIN Verification System

        </div>

    </div>


    <script>

        function verifyPIN() {

            const pin =
                document.getElementById("pin").value.trim();

            const error =
                document.getElementById("error");

            const resultBox =
                document.getElementById("resultBox");

            const resultTitle =
                document.getElementById("resultTitle");

            const resultDetails =
                document.getElementById("resultDetails");


            error.textContent = "";

            resultBox.style.display = "none";


            try {

                if (pin === "") {

                    throw new Error(
                        "Please enter your ATM PIN."
                    );

                }


                if (!/^\d+$/.test(pin)) {

                    throw new Error(
                        "PIN must contain digits only."
                    );

                }


                if (pin.length < 4) {

                    throw new Error(
                        "PIN must contain at least 4 digits."
                    );

                }


                const reversedPIN =
                    pin.split("")
                       .reverse()
                       .join("");


                resultBox.style.display = "block";


                if (pin === reversedPIN) {

                    resultTitle.textContent =
                        "ACCESS GRANTED ✓";

                    resultTitle.style.color =
                        "#15803d";


                    resultDetails.textContent =
                        "PIN verification was successful. " +
                        "The entered PIN is a palindrome.";

                    resultBox.style.backgroundColor =
                        "#f0fdf4";

                    resultBox.style.borderColor =
                        "#bbf7d0";


                    console.log(
                        "ATM access granted."
                    );

                }


                else {

                    resultTitle.textContent =
                        "ACCESS DENIED ✕";

                    resultTitle.style.color =
                        "#dc2626";


                    resultDetails.textContent =
                        "The entered PIN is not a palindrome. " +
                        "Please enter a valid palindrome PIN.";

                    resultBox.style.backgroundColor =
                        "#fef2f2";

                    resultBox.style.borderColor =
                        "#fecaca";


                    console.warn(
                        "ATM access denied."
                    );

                }

            }


            catch (message) {

                error.textContent =
                    message.message;


                console.error(
                    message.message
                );

            }

        }


        document
            .getElementById("pin")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        verifyPIN();

                    }

                }
            );

    </script>

</body>
</html>
