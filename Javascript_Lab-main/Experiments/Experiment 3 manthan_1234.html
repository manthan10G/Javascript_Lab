<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Grading System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eaf1ff,
                    #f8fafc
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            color: #1e293b;
        }


        .card {

            width: 650px;

            background-color: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 18px 45px
                rgba(30, 64, 175, 0.18);

        }


        .header {

            padding: 30px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #1e3a8a,
                    #2563eb
                );

        }


        .icon {

            width: 62px;

            height: 62px;

            margin:
                0 auto 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            background-color:
                rgba(255, 255, 255, 0.18);

            font-size: 28px;

        }


        .header h1 {

            margin: 0;

            font-size: 27px;

        }


        .header p {

            margin:
                8px 0 0;

            color: #dbeafe;

            font-size: 14px;

        }


        .content {

            padding: 30px;

        }


        .student-row {

            display: flex;

            gap: 15px;

            margin-bottom: 20px;

        }


        .student-group {

            width: 50%;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37, 99, 235, 0.12);

        }


        .subject-title {

            margin-top: 15px;

            margin-bottom: 15px;

            color: #1e3a8a;

            font-size: 18px;

        }


        .subjects {

            display: grid;

            grid-template-columns:

                1fr 1fr;

            gap: 15px;

        }


        .subject-box {

            padding: 15px;

            border:

                1px solid #e2e8f0;

            border-radius: 12px;

            background-color:

                #f8fafc;

        }


        .subject-box label {

            color:

                #334155;

        }


        .error {

            min-height: 18px;

            margin-top: 7px;

            color: #dc2626;

            font-size: 12px;

        }


        button {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 10px;

            color: white;

            background:

                linear-gradient(

                    135deg,

                    #1d4ed8,

                    #2563eb

                );

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            transform:

                translateY(-2px);

            box-shadow:

                0 8px 18px

                rgba(

                    37,

                    99,

                    235,

                    0.25

                );

        }


        .result-box {

            display: none;

            margin-top: 25px;

            padding: 22px;

            text-align: center;

            border-radius: 12px;

            background-color:

                #eff6ff;

            border:

                1px solid

                #bfdbfe;

        }


        .result-label {

            margin: 0;

            color:

                #64748b;

            font-size:

                13px;

        }


        #result {

            margin:

                8px 0;

            color:

                #1d4ed8;

            font-size:

                28px;

            font-weight:

                bold;

        }


        #details {

            margin:

                0;

            color:

                #475569;

            font-size:

                14px;

            line-height:

                1.8;

        }


        .subject-result {

            margin-top:

                20px;

            padding:

                15px;

            text-align:

                left;

            border-radius:

                10px;

            background:

                white;

            border:

                1px solid

                #dbeafe;

        }


        .subject-result h3 {

            margin:

                0 0 12px;

            color:

                #1e3a8a;

        }


        .subject-result p {

            margin:

                7px 0;

            color:

                #475569;

        }


        .footer {

            padding:

                15px;

            text-align:

                center;

            color:

                #64748b;

            background:

                #f8fafc;

            border-top:

                1px solid

                #e2e8f0;

            font-size:

                12px;

        }


        @media (

            max-width: 600px

        ) {

            .card {

                width:

                    100%;

            }


            .student-row {

                flex-direction:

                    column;

            }


            .student-group {

                width:

                    100%;

            }


            .subjects {

                grid-template-columns:

                    1fr;

            }

        }

    </style>

</head>


<body>


<div class="card">


    <div class="header">


        <div class="icon">

            🎓

        </div>


        <h1>

            Student Grading System

        </h1>


        <p>

            Enter subject-wise marks
            to calculate your result

        </p>


    </div>



    <div class="content">


        <div class="student-row">


            <div class="student-group">


                <label>

                    Student Name

                </label>


                <input

                    type="text"

                    id="studentName"

                    placeholder="Enter student name"

                >


            </div>



            <div class="student-group">


                <label>

                    Roll Number

                </label>


                <input

                    type="text"

                    id="rollNumber"

                    placeholder="Enter roll number"

                >


            </div>


        </div>



        <h2 class="subject-title">

            Enter Subject-wise Marks

        </h2>



        <div class="subjects">


            <div class="subject-box">


                <label>

                    Mathematics

                </label>


                <input

                    type="number"

                    id="math"

                    placeholder="Marks out of 100"

                    min="0"

                    max="100"

                >


            </div>



            <div class="subject-box">


                <label>

                    Physics

                </label>


                <input

                    type="number"

                    id="physics"

                    placeholder="Marks out of 100"

                    min="0"

                    max="100"

                >


            </div>



            <div class="subject-box">


                <label>

                    Chemistry

                </label>


                <input

                    type="number"

                    id="chemistry"

                    placeholder="Marks out of 100"

                    min="0"

                    max="100"

                >


            </div>



            <div class="subject-box">


                <label>

                    Computer Science

                </label>


                <input

                    type="number"

                    id="computer"

                    placeholder="Marks out of 100"

                    min="0"

                    max="100"

                >


            </div>



            <div class="subject-box">


                <label>

                    English

                </label>


                <input

                    type="number"

                    id="english"

                    placeholder="Marks out of 100"

                    min="0"

                    max="100"

                >


            </div>


        </div>


        <div

            class="error"

            id="errorMessage"

        ></div>



        <button

            onclick="calculateGrade()"

        >

            Calculate Result

        </button>



        <div

            class="result-box"

            id="resultBox"

        >


            <p class="result-label">

                STUDENT RESULT

            </p>


            <h2 id="result">

                —

            </h2>


            <p id="details">

            </p>



            <div

                class="subject-result"

                id="subjectResult"

            >

            </div>


        </div>


    </div>



    <div class="footer">

        Student Academic Performance Calculator

    </div>


</div>



<script>


function calculateGrade() {


    const studentName =

        document

        .getElementById(

            "studentName"

        )

        .value;


    const rollNumber =

        document

        .getElementById(

            "rollNumber"

        )

        .value;


    const math =

        Number(

            document

            .getElementById(

                "math"

            )

            .value

        );


    const physics =

        Number(

            document

            .getElementById(

                "physics"

            )

            .value

        );


    const chemistry =

        Number(

            document

            .getElementById(

                "chemistry"

            )

            .value

        );


    const computer =

        Number(

            document

            .getElementById(

                "computer"

            )

            .value

        );


    const english =

        Number(

            document

            .getElementById(

                "english"

            )

            .value

        );


    const errorMessage =

        document

        .getElementById(

            "errorMessage"

        );


    const resultBox =

        document

        .getElementById(

            "resultBox"

        );


    errorMessage

    .textContent = "";


    resultBox

    .style

    .display = "none";


    const marks = [

        math,

        physics,

        chemistry,

        computer,

        english

    ];


    if (

        studentName === ""

    ) {


        errorMessage

        .textContent =

        "Please enter student name.";


        return;

    }


    if (

        marks.some(

            mark =>

            Number.isNaN(

                mark

            )

        )

    ) {


        errorMessage

        .textContent =

        "Please enter marks for all subjects.";


        return;

    }


    if (

        marks.some(

            mark =>

            mark < 0

            ||

            mark > 100

        )

    ) {


        errorMessage

        .textContent =

        "Marks must be between 0 and 100.";


        return;

    }


    const total =

        math

        +

        physics

        +

        chemistry

        +

        computer

        +

        english;


    const percentage =

        total

        /

        5;


    let grade;


    let remark;


    if (

        percentage >= 90

    ) {


        grade = "A";


        remark =

        "Excellent Performance";


    }


    else if (

        percentage >= 80

    ) {


        grade = "B";


        remark =

        "Very Good Performance";


    }


    else if (

        percentage >= 70

    ) {


        grade = "C";


        remark =

        "Good Performance";


    }


    else if (

        percentage >= 60

    ) {


        grade = "D";


        remark =

        "Pass";


    }


    else {


        grade = "F";


        remark =

        "Needs Improvement";


    }


    document

    .getElementById(

        "result"

    )

    .textContent =

    "Grade " + grade;


    document

    .getElementById(

        "details"

    )

    .innerHTML =


    "<b>Student: </b>"

    +

    studentName


    +

    "<br>"


    +

    "<b>Roll Number: </b>"

    +

    rollNumber


    +

    "<br><br>"


    +

    "<b>"

    +

    remark

    +

    "</b>"


    +

    "<br>"


    +

    "Total Marks: "

    +

    total

    +

    " / 500"


    +

    "<br>"


    +

    "Percentage: "

    +

    percentage

    .toFixed(

        2

    )

    +

    "%";


    document

    .getElementById(

        "subjectResult"

    )

    .innerHTML =


    "<h3>Subject-wise Result</h3>"


    +

    "<p>Mathematics: "

    +

    math

    +

    " / 100</p>"


    +

    "<p>Physics: "

    +

    physics

    +

    " / 100</p>"


    +

    "<p>Chemistry: "

    +

    chemistry

    +

    " / 100</p>"


    +

    "<p>Computer Science: "

    +

    computer

    +

    " / 100</p>"


    +

    "<p>English: "

    +

    english

    +

    " / 100</p>";


    resultBox

    .style

    .display =

    "block";


}


</script>


</body>

</html>
