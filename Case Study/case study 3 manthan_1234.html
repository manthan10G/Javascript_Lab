<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scholarship Eligibility Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .card {
            width: 450px;
            background-color: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(30, 64, 175, 0.18);
        }

        .header {
            background: #1e40af;
            color: white;
            text-align: center;
            padding: 28px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #dbeafe;
        }

        .content {
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        #result h2 {
            margin: 0 0 8px;
            color: #1d4ed8;
            font-size: 20px;
        }

        #result p {
            margin: 0;
            color: #475569;
            line-height: 1.5;
        }

        .criteria {
            margin-top: 25px;
            padding: 18px;
            background-color: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .criteria h3 {
            margin: 0 0 12px;
            color: #1e293b;
            font-size: 16px;
        }

        .criteria p {
            margin: 9px 0;
            font-size: 14px;
            color: #475569;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f8fafc;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <h1>Scholarship Eligibility</h1>
            <p>Check your scholarship category based on marks</p>
        </div>

        <div class="content">

            <label for="marks">Enter Your Marks</label>

            <input
                type="number"
                id="marks"
                min="0"
                max="100"
                placeholder="Enter marks from 0 to 100"
            >

            <button onclick="getCategory()">
                Check Eligibility
            </button>

            <div id="result"></div>

            <div class="criteria">

                <h3>Scholarship Criteria</h3>

                <p><b>Gold Scholarship:</b> 90 – 100 Marks</p>

                <p><b>Silver Scholarship:</b> 75 – 89 Marks</p>

                <p><b>Bronze Scholarship:</b> 60 – 74 Marks</p>

                <p><b>No Scholarship:</b> Below 60 Marks</p>

            </div>

        </div>

        <div class="footer">
            Scholarship Eligibility Calculator
        </div>

    </div>

    <script>

        function getCategory() {

            const marksInput =
                document.getElementById("marks");

            const marks =
                Number(marksInput.value);

            const result =
                document.getElementById("result");

            result.style.display = "block";

            if (marksInput.value === "") {

                result.innerHTML =
                    "<h2>Input Required</h2>" +
                    "<p>Please enter your marks.</p>";

                return;
            }

            if (marks < 0 || marks > 100) {

                result.innerHTML =
                    "<h2>Invalid Marks</h2>" +
                    "<p>Please enter marks between 0 and 100.</p>";

                return;
            }

            let category;
            let message;

            if (marks >= 90) {

                category = "Gold Scholarship";

                message =
                    "Congratulations! You are eligible for the Gold Scholarship.";

            }

            else if (marks >= 75) {

                category = "Silver Scholarship";

                message =
                    "Congratulations! You are eligible for the Silver Scholarship.";

            }

            else if (marks >= 60) {

                category = "Bronze Scholarship";

                message =
                    "Congratulations! You are eligible for the Bronze Scholarship.";

            }

            else {

                category = "No Scholarship";

                message =
                    "You are currently not eligible for a scholarship.";

            }

            result.innerHTML =
                "<h2>" + category + "</h2>" +
                "<p>" + message + "</p>";

            console.log("Student Marks:", marks);

            console.log(
                "Scholarship Category:",
                category
            );

        }

    </script>

</body>
</html>
