<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Admission Form</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    :root {
      --body-start: #111827;
      --body-end: #2563eb;
      --container-bg: #ffffff;
      --text-color: #333333;
      --heading-color: #1e3a8a;
      --muted-color: #666666;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow: rgba(0, 0, 0, 0.25);
      --toggle-bg: #1f2937;
    }

    body.dark-theme {
      --body-start: #020617;
      --body-end: #1e3a8a;
      --container-bg: #1f2937;
      --text-color: #f9fafb;
      --heading-color: #93c5fd;
      --muted-color: #d1d5db;
      --input-bg: #374151;
      --input-border: #6b7280;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --shadow: rgba(0, 0, 0, 0.5);
      --toggle-bg: #f59e0b;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        135deg,
        var(--body-start),
        var(--body-end)
      );
      padding: 20px;
      transition: background 0.3s ease;
    }

    .form-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      background: var(--container-bg);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px var(--shadow);
      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: auto;
      padding: 8px 12px;
      border: none;
      border-radius: 50%;
      background: var(--toggle-bg);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: var(--heading-color);
    }

    .subtitle {
      text-align: center;
      color: var(--muted-color);
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: var(--text-color);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--input-border);
      border-radius: 7px;
      color: var(--text-color);
      background: var(--input-bg);
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted-color);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
    }

    input.valid,
    select.valid,
    textarea.valid {
      border-color: #16a34a;
    }

    input.invalid,
    select.invalid,
    textarea.invalid {
      border-color: #dc2626;
    }

    .error {
      display: block;
      color: #dc2626;
      font-size: 13px;
      margin-top: 5px;
      min-height: 16px;
    }

    .success {
      color: #16a34a;
      font-size: 14px;
      margin-top: 5px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .gender-options {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .gender-options label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .gender-options input {
      width: auto;
    }

    .terms {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 18px 0 0;
      font-size: 14px;
    }

    .terms input {
      width: auto;
    }

    .terms label {
      margin: 0;
      font-weight: normal;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: var(--primary-color);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button[type="submit"]:hover {
      background: var(--primary-hover);
    }

    button[type="submit"]:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #formMessage {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .form-container {
        padding: 22px;
      }

      .theme-toggle {
        top: 14px;
        right: 14px;
      }

      .gender-options {
        flex-wrap: wrap;
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="form-container">
    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      title="Toggle theme"
      aria-label="Toggle theme"
    >
      🌙
    </button>

    <h1>Gym Admission Form</h1>
    <p class="subtitle">Join today and start your fitness journey</p>

    <form id="gymForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
        />
        <span class="error" id="fullNameError"></span>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="example@email.com"
          />
          <span class="error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="10-digit phone number"
          />
          <span class="error" id="phoneError"></span>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="age">Age</label>
          <input
            type="number"
            id="age"
            placeholder="Enter your age"
            min="13"
            max="80"
          />
          <span class="error" id="ageError"></span>
        </div>

        <div class="form-group">
          <label for="membership">Membership Plan</label>
          <select id="membership">
            <option value="">Select a plan</option>
            <option value="monthly">Monthly - $30</option>
            <option value="quarterly">Quarterly - $80</option>
            <option value="yearly">Yearly - $250</option>
          </select>
          <span class="error" id="membershipError"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Gender</label>

        <div class="gender-options">
          <label>
            <input type="radio" name="gender" value="male" />
            Male
          </label>

          <label>
            <input type="radio" name="gender" value="female" />
            Female
          </label>

          <label>
            <input type="radio" name="gender" value="other" />
            Other
          </label>
        </div>

        <span class="error" id="genderError"></span>
      </div>

      <div class="form-group">
        <label for="goal">Fitness Goal</label>
        <select id="goal">
          <option value="">Select your goal</option>
          <option value="weight-loss">Weight Loss</option>
          <option value="muscle-gain">Muscle Gain</option>
          <option value="fitness">General Fitness</option>
          <option value="bodybuilding">Bodybuilding</option>
        </select>
        <span class="error" id="goalError"></span>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea
          id="address"
          rows="3"
          placeholder="Enter your address"
        ></textarea>
        <span class="error" id="addressError"></span>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" />
        <label for="terms">
          I agree to the gym rules and membership terms.
        </label>
      </div>

      <span class="error" id="termsError"></span>

      <button type="submit" id="submitButton" disabled>
        Submit Admission
      </button>

      <p id="formMessage"></p>
    </form>
  </div>

  <script>
    const gymForm = document.getElementById("gymForm");

    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const phone = document.getElementById("phone");
    const age = document.getElementById("age");
    const membership = document.getElementById("membership");
    const goal = document.getElementById("goal");
    const address = document.getElementById("address");
    const terms = document.getElementById("terms");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");
    const themeToggle = document.getElementById("themeToggle");

    const validationState = {
      fullName: false,
      email: false,
      phone: false,
      age: false,
      membership: false,
      gender: false,
      goal: false,
      address: false,
      terms: false
    };

    function showResult(input, errorId, isValid, errorMessage) {
      const errorElement = document.getElementById(errorId);

      input.classList.remove("valid", "invalid");
      errorElement.classList.remove("success");

      if (isValid) {
        input.classList.add("valid");
        errorElement.textContent = "✓";
        errorElement.classList.add("success");
      } else {
        input.classList.add("invalid");
        errorElement.textContent = errorMessage;
      }
    }

    function validateName() {
      const nameValue = fullName.value.trim();
      const isValid =
        nameValue.length >= 3 &&
        /^[A-Za-z ]+$/.test(nameValue);

      validationState.fullName = isValid;

      showResult(
        fullName,
        "fullNameError",
        isValid,
        "Enter a valid name with at least 3 letters."
      );

      updateSubmitButton();
    }

    function validateEmail() {
      const emailValue = email.value.trim();
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/i;
      const isValid = emailPattern.test(emailValue);

      validationState.email = isValid;

      showResult(
        email,
        "emailError",
        isValid,
        "Enter a valid email address."
      );

      updateSubmitButton();
    }

    function validatePhone() {
      const phoneValue = phone.value.trim();
      const phonePattern = /^[0-9]{10}$/;
      const isValid = phonePattern.test(phoneValue);

      validationState.phone = isValid;

      showResult(
        phone,
        "phoneError",
        isValid,
        "Phone number must contain exactly 10 digits."
      );

      updateSubmitButton();
    }

    function validateAge() {
      const ageValue = Number(age.value);
      const isValid = ageValue >= 13 && ageValue <= 80;

      validationState.age = isValid;

      showResult(
        age,
        "ageError",
        isValid,
        "Age must be between 13 and 80."
      );

      updateSubmitButton();
    }

    function validateMembership() {
      const isValid = membership.value !== "";

      validationState.membership = isValid;

      showResult(
        membership,
        "membershipError",
        isValid,
        "Please select a membership plan."
      );

      updateSubmitButton();
    }

    function validateGender() {
      const selectedGender = document.querySelector(
        'input[name="gender"]:checked'
      );

      const genderError = document.getElementById("genderError");
      const isValid = selectedGender !== null;

      validationState.gender = isValid;

      genderError.classList.remove("success");
      genderError.textContent = isValid
        ? "✓"
        : "Please select your gender.";

      if (isValid) {
        genderError.classList.add("success");
      }

      updateSubmitButton();
    }

    function validateGoal() {
      const isValid = goal.value !== "";

      validationState.goal = isValid;

      showResult(
        goal,
        "goalError",
        isValid,
        "Please select your fitness goal."
      );

      updateSubmitButton();
    }

    function validateAddress() {
      const addressValue = address.value.trim();
      const isValid = addressValue.length >= 10;

      validationState.address = isValid;

      showResult(
        address,
        "addressError",
        isValid,
        "Address must contain at least 10 characters."
      );

      updateSubmitButton();
    }

    function validateTerms() {
      const termsError = document.getElementById("termsError");
      const isValid = terms.checked;

      validationState.terms = isValid;

      termsError.classList.remove("success");
      termsError.textContent = isValid
        ? "✓"
        : "You must accept the terms.";

      if (isValid) {
        termsError.classList.add("success");
      }

      updateSubmitButton();
    }

    function updateSubmitButton() {
      const allValid = Object.values(validationState).every(
        value => value === true
      );

      submitButton.disabled = !allValid;
    }

    function resetValidation() {
      document
        .querySelectorAll("input, select, textarea")
        .forEach(field => {
          field.classList.remove("valid", "invalid");
        });

      document.querySelectorAll(".error").forEach(error => {
        error.textContent = "";
        error.classList.remove("success");
      });

      Object.keys(validationState).forEach(key => {
        validationState[key] = false;
      });

      updateSubmitButton();
    }

    fullName.addEventListener("input", validateName);
    email.addEventListener("input", validateEmail);
    phone.addEventListener("input", validatePhone);
    age.addEventListener("input", validateAge);
    address.addEventListener("input", validateAddress);

    membership.addEventListener("change", validateMembership);
    goal.addEventListener("change", validateGoal);
    terms.addEventListener("change", validateTerms);

    document
      .querySelectorAll('input[name="gender"]')
      .forEach(radio => {
        radio.addEventListener("change", validateGender);
      });

    gymForm.addEventListener("submit", function (event) {
      event.preventDefault();

      validateName();
      validateEmail();
      validatePhone();
      validateAge();
      validateMembership();
      validateGender();
      validateGoal();
      validateAddress();
      validateTerms();

      const isFormValid = Object.values(validationState).every(
        value => value === true
      );

      if (isFormValid) {
        formMessage.textContent =
          "Admission submitted successfully!";
        formMessage.style.color = "#16a34a";

        gymForm.reset();
        resetValidation();
      } else {
        formMessage.textContent =
          "Please correct the errors before submitting.";
        formMessage.style.color = "#dc2626";
      }
    });

    function applyTheme(theme) {
      const isDark = theme === "dark";

      document.body.classList.toggle("dark-theme", isDark);

      themeToggle.textContent = isDark ? "☀️" : "🌙";
      themeToggle.title = isDark
        ? "Switch to light theme"
        : "Switch to dark theme";
    }

    const savedTheme = localStorage.getItem("gym-theme") || "light";
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", function () {
      const isDark = document.body.classList.contains("dark-theme");
      const newTheme = isDark ? "light" : "dark";

      applyTheme(newTheme);
      localStorage.setItem("gym-theme", newTheme);
    });
  </script>
</body>
</html>
