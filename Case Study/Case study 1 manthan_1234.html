<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIT Nagpur | Student Information</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #0f172a;
            background: linear-gradient(135deg, #eaf1ff, #f8fafc);
        }

        .card {
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            background-color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(30, 64, 175, 0.18);
        }

        .header {
            padding: 30px;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 28px;
            background-color: rgba(255, 255, 255, 0.18);
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
        }

        .header p {
            margin: 8px 0 0;
            color: #dbeafe;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        label:first-child {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            color: white;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        #output {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            background-color: #eff6ff;
        }

        #output h2 {
            margin: 0 0 15px;
            color: #1d4ed8;
            font-size: 21px;
        }

        #output p {
            margin: 9px 0;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            margin-top: 15px !important;
            padding-top: 14px;
            color: #15803d !important;
            font-weight: bold;
            border-top: 1px solid #bfdbfe;
        }

        .footer {
            padding: 15px;
            text-align: center;
            color: #64748b;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
        }

        @media (max-width: 550px) {
            body {
                padding: 15px;
            }

            .content {
                padding: 22px;
            }

            .header {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <div class="logo">🎓</div>

            <h1>SIT Nagpur</h1>

            <p>Student Information Management System</p>
        </div>

        <div class="content">

            <label for="name">Student Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <label for="roll">Roll Number</label>

            <input
                type="text"
                id="roll"
                placeholder="Enter your roll number"
            >

            <label for="department">Department</label>

            <input
                type="text"
                id="department"
                placeholder="Example: Computer Science Engineering"
            >

            <button onclick="displayInformation()">
                Submit Information
            </button>

            <div id="output"></div>

        </div>

        <div class="footer">
            SIT Nagpur | Student Information Portal
        </div>

    </div>

    <script>

        console.log("SIT Nagpur Student Information Page Loaded");

        function displayInformation() {

            const name =
                document.getElementById("name").value.trim();

            const roll =
                document.getElementById("roll").value.trim();

            const department =
                document.getElementById("department").value.trim();

            const output =
                document.getElementById("output");

            if (
                name === "" ||
                roll === "" ||
                department === ""
            ) {

                alert("Please fill in all the required details.");

                console.error(
                    "Student information is incomplete."
                );

                return;
            }

            output.style.display = "block";

            output.innerHTML = `
                <h2>Welcome, ${name}!</h2>

                <p>
                    <b>Roll Number:</b>
                    ${roll}
                </p>

                <p>
                    <b>Department:</b>
                    ${department}
                </p>

                <p class="success">
                    ✓ Your information has been submitted successfully.
                </p>
            `;

            console.log("Student Name:", name);
            console.log("Roll Number:", roll);
            console.log("Department:", department);

            console.warn(
                "Student information submitted successfully."
            );
        }

    </script>

</body>

</html>
