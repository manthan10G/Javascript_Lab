<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Preferences</title>

  <style>
    :root {
      --accent: #2869d8;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #20252b;
      --muted: #6f7780;
      --border: #e1e5e9;
      --panel: #f1f1f1;
      --shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      --font-size: 13px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: var(--font-size);
      transition: background 0.25s, color 0.25s;
    }

    .preferences-card {
      width: 100%;
      max-width: 390px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      transition: background 0.25s, border 0.25s;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 18px;
      line-height: 1.2;
    }

    .description {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      border-bottom: 1px solid var(--border);
    }

    .setting-row label {
      color: var(--text);
      font-weight: bold;
      font-size: 10px;
    }

    select,
    input[type="text"] {
      height: 25px;
      border: 1px solid #cbd1d7;
      border-radius: 3px;
      padding: 0 7px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    select {
      width: 76px;
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      margin-top: 7px;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .color-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 25px;
      height: 18px;
      padding: 0;
      border: 1px solid #cbd1d7;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      gap: 6px;
      margin: 14px 0 18px;
    }

    button {
      min-height: 25px;
      padding: 4px 8px;
      border: 0;
      border-radius: 3px;
      color: #ffffff;
      font-size: 9px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.88;
    }

    button:active {
      transform: scale(0.97);
    }

    .save-btn {
      background: var(--accent);
    }

    .reset-btn {
      background: #68717b;
    }

    .clear-btn {
      background: #d9363e;
    }

    .storage-panel {
      padding: 12px;
      background: var(--panel);
      border-radius: 3px;
      transition: background 0.25s;
    }

    .storage-panel h2 {
      margin: 0 0 4px;
      font-size: 10px;
    }

    .storage-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .storage-panel button {
      margin-top: 8px;
    }

    .message {
      min-height: 14px;
      margin-top: 8px !important;
    }

    /* Dark theme */
    body.dark {
      --bg: #101827;
      --card: #192635;
      --text: #f0f4f8;
      --muted: #a8b2bd;
      --border: #263746;
      --panel: #223241;
      --shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    body.dark select,
    body.dark input[type="text"] {
      border-color: #425464;
    }

    @media (max-width: 440px) {
      .preferences-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="preferences-card">
    <h1>User Preferences</h1>

    <p class="description">
      Choose a theme, text size, and accent color for your saved preferences.
    </p>

    <div class="setting-row">
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="fontSize">Font Size</label>
      <select id="fontSize">
        <option value="12px">Small</option>
        <option value="13px" selected>Medium</option>
        <option value="15px">Large</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="accentColor">Accent Color</label>

      <div class="color-control">
        <input type="color" id="accentColor" value="#2869d8" />
      </div>
    </div>

    <div class="buttons">
      <button class="save-btn" id="savePreferences">
        Save Preferences
      </button>

      <button class="reset-btn" id="resetPreferences">
        Reset Preferences
      </button>

      <button class="clear-btn" id="clearStorage">
        Clear Storage
      </button>
    </div>

    <section class="storage-panel">
      <h2>Session Storage Message</h2>

      <p>
        This message is saved only for the current browser session.
      </p>

      <input
        type="text"
        id="sessionMessage"
        placeholder="Enter your message"
      />

      <button class="save-btn" id="saveMessage">
        Save Session Message
      </button>

      <p class="message" id="storedMessage">
        Stored session message: None
      </p>
    </section>
  </main>

  <script>
    const defaultPreferences = {
      theme: "light",
      fontSize: "13px",
      accentColor: "#2869d8"
    };

    const themeSelect = document.getElementById("theme");
    const fontSizeSelect = document.getElementById("fontSize");
    const accentColorInput = document.getElementById("accentColor");
    const sessionMessageInput = document.getElementById("sessionMessage");
    const storedMessage = document.getElementById("storedMessage");

    function applyPreferences(preferences) {
      document.body.classList.toggle(
        "dark",
        preferences.theme === "dark"
      );

      document.documentElement.style.setProperty(
        "--font-size",
        preferences.fontSize
      );

      document.documentElement.style.setProperty(
        "--accent",
        preferences.accentColor
      );

      themeSelect.value = preferences.theme;
      fontSizeSelect.value = preferences.fontSize;
      accentColorInput.value = preferences.accentColor;
    }

    function getPreferencesFromForm() {
      return {
        theme: themeSelect.value,
        fontSize: fontSizeSelect.value,
        accentColor: accentColorInput.value
      };
    }

    function savePreferences() {
      const preferences = getPreferencesFromForm();

      localStorage.setItem(
        "userPreferences",
        JSON.stringify(preferences)
      );

      applyPreferences(preferences);
      alert("Preferences saved.");
    }

    function loadPreferences() {
      const savedPreferences = localStorage.getItem("userPreferences");

      if (savedPreferences) {
        try {
          const preferences = {
            ...defaultPreferences,
            ...JSON.parse(savedPreferences)
          };

          applyPreferences(preferences);
        } catch (error) {
          applyPreferences(defaultPreferences);
        }
      } else {
        applyPreferences(defaultPreferences);
      }
    }

    function resetPreferences() {
      localStorage.removeItem("userPreferences");
      applyPreferences(defaultPreferences);
      alert("Preferences reset.");
    }

    function clearStorage() {
      localStorage.clear();
      sessionStorage.clear();

      sessionMessageInput.value = "";
      storedMessage.textContent = "Stored session message: None";

      alert("Local and session storage cleared.");
    }

    function saveSessionMessage() {
      const message = sessionMessageInput.value.trim();

      if (!message) {
        storedMessage.textContent = "Stored session message: None";
        sessionStorage.removeItem("sessionMessage");
        return;
      }

      sessionStorage.setItem("sessionMessage", message);
      displaySessionMessage();
    }

    function displaySessionMessage() {
      const message = sessionStorage.getItem("sessionMessage");

      if (message) {
        sessionMessageInput.value = message;
        storedMessage.textContent =
          "Stored session message: " + message;
      } else {
        storedMessage.textContent =
          "Stored session message: None";
      }
    }

    // Live preview while changing controls
    themeSelect.addEventListener("change", () => {
      applyPreferences(getPreferencesFromForm());
    });

    fontSizeSelect.addEventListener("change", () => {
      applyPreferences(getPreferencesFromForm());
    });

    accentColorInput.addEventListener("input", () => {
      applyPreferences(getPreferencesFromForm());
    });

    document
      .getElementById("savePreferences")
      .addEventListener("click", savePreferences);

    document
      .getElementById("resetPreferences")
      .addEventListener("click", resetPreferences);

    document
      .getElementById("clearStorage")
      .addEventListener("click", clearStorage);

    document
      .getElementById("saveMessage")
      .addEventListener("click", saveSessionMessage);

    loadPreferences();
    displaySessionMessage();
  </script>
</body>
</html>
